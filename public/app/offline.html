    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'self'" />

    <title>SparkChat</title>
    <style>
      :root { color-scheme: dark light; --bg: #14121f; --card: #1f1c30; --text: #f4f2ff; --muted: #b9b4d6; --accent: #6c5ce7; }
      @media (prefers-color-scheme: light) { :root { --bg: #f4f2ff; --card: #ffffff; --text: #1d1a2e; --muted: #5d5878; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: 100%; max-width: 420px; background: var(--card); border-radius: 20px; padding: 32px 24px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25); }
      .logo { display: block; margin: 0 auto; }
      h1 { font-size: 1.3rem; margin: 18px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 6px; }
      .en { margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(127, 127, 160, 0.25); }
      form { margin-top: 22px; }
      button { appearance: none; border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 700; color: #fff; background: var(--accent); cursor: pointer; }
    </style>

      <section lang="pt-BR">
        <h1>Você está sem internet</h1>
        <p>O SparkChat precisa de conexão para enviar e receber mensagens. Assim que a internet voltar, toque em tentar de novo.</p>
      </section>
      <section class="en" lang="en">
